name: Release

# Push a tag like v1.0.0 to build and publish a GitHub release.
# "Run workflow" (manual) builds the same files as an artifact without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $ver" }

      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item target\release\pd2-mod-manager.exe, README.md dist\portable
          Copy-Item LICENSE dist\portable\LICENSE.txt
          Compress-Archive -Path dist\portable\* -DestinationPath dist\PD2-Mod-Manager-Portable.zip -Force
          Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pd2-mod-manager
          path: |
            dist/PD2-Mod-Manager-Setup.exe
            dist/PD2-Mod-Manager-Portable.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: PD2 Mod Manager ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/PD2-Mod-Manager-Setup.exe
            dist/PD2-Mod-Manager-Portable.zip
