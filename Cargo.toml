[package]
name = "pd2-mod-manager"
version = "1.0.0"
edition = "2021"
description = "Desktop mod manager for PAYDAY 2 (Epic / Steam) with ModWorkshop and Nexus Mods support"
license = "MIT"
repository = "https://github.com/catdum200/PayDay2-mod-manager"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
sevenz-rust = "0.6"
unrar = "0.5"
walkdir = "2"
dirs = "5"
open = "5"
rfd = "0.15"
anyhow = "1"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
